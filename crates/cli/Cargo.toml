[package]
name = "triodion-cli"
description = "triodion is the easiest way to extract blockchain data to parquet, csv, or json"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "triodion_cli"
path = "src/lib.rs"

[[bin]]
name = "triodion"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
alloy = { workspace = true }
anstyle = { workspace = true }
clap = { workspace = true }
color-print = { workspace = true }
colored = { workspace = true }
triodion-core = { workspace = true }
eyre = { workspace = true }
governor = { workspace = true }
hex = { workspace = true }
mesc = { workspace = true }
polars = { workspace = true }
polars-parquet = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[features]
default = ["jemalloc"]
# Sets jemalloc as the global allocator of the `triodion` binary. The library
# never sets an allocator, so crates/python turns this off and does not build
# jemalloc's C sources for nothing.
jemalloc = ["dep:tikv-jemallocator"]

[lints]
workspace = true
