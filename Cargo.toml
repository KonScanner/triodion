
[workspace]
members  = ["crates/cli", "crates/freeze", "crates/to_df"]
# crates/python is intentionally NOT a workspace member: it depends on
# pyo3-polars which enables `polars-error/python`, propagating pyo3 with the
# `extension-module` feature into every workspace crate via Cargo's feature
# unification — which then fails to link the standalone `triodion` binary.
# It is a standalone crate (see crates/python/Cargo.toml) and is built
# separately via the `python-wheel` Makefile target.
exclude  = ["crates/python"]

# Resolver 3 (Cargo 1.84+) gives per-target feature resolution, which we need
# so pyo3's `extension-module` feature (enabled only by crates/python) does
# not propagate via workspace unification into the standalone `triodion` binary,
# where it causes link errors for PyErr_* symbols.
resolver = "3"

[workspace.package]
version = "0.4.4"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/KonScanner/triodion"
repository = "https://github.com/KonScanner/triodion"
exclude = [".github/"]

[workspace.dependencies]
triodion-cli = { version = "0.4.4", path = "./crates/cli" }
triodion-core = { version = "0.4.4", path = "./crates/freeze" }
triodion-macros = { version = "0.4.4", path = "./crates/to_df" }

alloy = { version = "2.0.5", features = [
    "full",
    "rpc-types-trace",
    "provider-ws",
    "provider-ipc",
    "provider-debug-api",
    "provider-trace-api",
    "transport-ipc-mock",
] }
anstyle = "1.0.14"
# The 0.4.41 cap is lifted. It existed because polars-arrow 0.53 required
# chrono's `std` feature, which 0.4.42 removed (it became default-on with no
# opt-out). polars-arrow 0.55 no longer asks for it, so chrono resolves to
# 0.4.45 and the workspace builds clean.
chrono = { version = "0.4", features = ["serde"] }
# clap_cryo carries a known-unsound transitive dependency and there is no
# in-place fix: clap_builder_cryo requires `anstream ^0.3`, and the
# RUSTSEC-2024-0404 fix for `anstream::adapter::strip_str` first shipped in
# `anstream 0.6.8`. No 0.3.x release carries it. Dropping the `color` feature
# does not help either — Cargo.lock is resolved feature-independently, so the
# `anstream` entry (and the alert) stays.
#
# The only real fix is to leave the fork for upstream clap, and that is not
# free. clap_builder_cryo's sole delta over clap_builder 4.3.21 is
# `is_number_range()`: it lets an arg with `allow_negative_numbers` accept
# `-1000:-500` and `-1000:latest` as VALUES rather than flags. Upstream clap
# 4.6 rejects both ("unexpected argument '-1' found"), and its
# `allow_hyphen_values` alternative is greedy — it swallows the next real flag
# (`-b -1000:latest --align` puts `--align` into `blocks`). Migrating needs an
# argv normalisation pass in front of the parser, which is separate work.
#
# Blast radius meanwhile: `strip_str` mis-segments a specific UTF-8 + ANSI
# escape byte sequence. It runs only when clap strips colour from help text.
clap_cryo = { version = "4.3.21-cryo", features = [
    "derive",
    "color",
    "unstable-styles",
] }
# colored stays on 2.x: colored 3.0 dropped the `truecolor()` method that
# crates/cli/src/args.rs:334 relies on for the optional-subcommands header.
# Bumping requires rewriting that header to use anstyle (already imported)
# or `\x1b[…m` escapes, which is not free. Stay until a more targeted bump.
colored = "2.2.0"
color-print = "0.3.7"
eyre = "0.6.12"
futures = "0.3.32"
# governor stays on 0.6.x: 0.10 renames `NoOpMiddleware` and reshapes the
# `RateLimiter<_, _, _, _>` type alias used in crates/freeze/src/types/sources.rs.
# Holding the latest 0.6 patch until we decide to migrate the alias.
governor = "0.6.3"
hex = "0.4.3"
heck = "0.5.0"
indexmap = "2.14.0"
indicatif = "0.18.4"
# lazy_static intentionally removed: not used by any triodion crate (only pulled
# in transitively by colored/color-print). LazyLock (std, since 1.80) is the
# modern replacement if we ever need one in our own code.
mesc = "0.1.4"
# polars 0.55 is the floor set by pyo3-polars 0.28 (see the pyo3 note below).
#
# Known open advisory below this pin: polars-error 0.55 requires
# `object_store ^0.13`, and object_store 0.13.2 requires `quick-xml ^0.39`,
# which carries RUSTSEC-2026-0194 and RUSTSEC-2026-0195 (both denial of
# service). object_store 0.14.1 moved to the patched `quick-xml ^0.41`, so the
# fix arrives when polars bumps object_store. We cannot force it from here.
# Reach: the XML paths are cloud object-store responses (S3, Azure). triodion
# writes local files, so nothing in our own code drives them.
polars = { version = "0.55", features = [
    "parquet",
    "string_encoding",
    "lazy",
    "binary_encoding",
    "json",
    "dtype-struct",
] }
# polars-io stopped re-exporting GzipLevel/BrotliLevel/ZstdLevel; we import
# them directly from polars-parquet to preserve user-controlled compression
# levels in the CLI.
polars-parquet = "0.55"
prefix-hex = "0.7.1"
# pyo3 0.29 is the floor set by RUSTSEC-2026-0176 (out-of-bounds read in
# `nth` / `nth_back` for `PyList` / `PyTuple` iterators) and RUSTSEC-2026-0177
# (missing `Sync` bound on `PyCFunction::new_closure`). Both are patched in
# `>= 0.29.0`. pyo3-polars 0.28.0 requires `pyo3 ^0.29` and `polars ^0.55.1`,
# so the whole stack moves together — a mixed graph makes the pyo3 macros
# fail at compile time with "found multiple versions of pyo3".
#
# NB: `extension-module` is set per-crate in crates/python/Cargo.toml only.
# Enabling it workspace-wide propagates via Cargo's feature unification and
# breaks the standalone `triodion` binary (link errors for PyErr_* symbols).
pyo3 = "0.29"
pyo3-build-config = "0.29"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pyo3-polars = "0.28"
# rand stays on 0.8.x: 0.9 removed `thread_rng` (renamed `rng`) and rebuilt
# the `SeedableRng`/`SliceRandom` traits, which `crates/cli/src/parse/partitions.rs`
# uses. Bumping is a small mechanical refactor — separate work item.
rand = "0.8.6"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
thousands = "0.2.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync"] }

[profile.dev]
incremental = true
debug = 1
codegen-units = 32
