# Pinned toolchain for the triodion-py extension crate.
#
# Read by rustup (and by cargo via rustup's proxy): every cargo invocation
# made FROM THIS DIRECTORY or below auto-installs and uses this toolchain.
# Note the "from this directory" part -- rustup selects on the working
# directory, not on `--manifest-path`. Running
# `cargo check --manifest-path crates/python/Cargo.toml` from the repository
# root uses the ROOT rust-toolchain.toml (stable) instead of this pin.
# The `python` job in .github/workflows/build_and_test.yml therefore sets
# `working-directory: crates/python` so CI compiles against this pin.
#
# Why 1.95.0:
#   - Several transitive deps in the workspace Cargo.lock have bumped their
#     MSRV beyond triodion's nominal 1.85: ruint 1.18 needs 1.90, nybbles 0.4.8
#     / serde_with 3.20 / simd-json 0.17 need 1.88. A 1.85.0 pin no longer
#     compiles the workspace.
#   - Cargo 1.84+ resolver = "3" is required by the parent triodion workspace
#     (the workspace Cargo.toml); 1.95.0 satisfies that.
#   - Edition 2024 needs >= 1.85; this crate is on edition 2024.
#
# Verified: 1.95.0 builds this crate clean as of the edition-2024 migration.
# Current stable is ahead of this pin, which is the point -- the pin exists so
# that a toolchain bump is a deliberate, reviewed change rather than something
# that happens on whatever day a contributor last ran `rustup update`.
#
# profile = "minimal" keeps the auto-install small (~150MB vs ~1GB for full
# stable). rustfmt and clippy are requested explicitly because CI runs both
# against this crate.
[toolchain]
channel    = "1.95.0"
profile    = "minimal"
components = ["rustfmt", "clippy"]
